[project]
name = "debrief"
version = "0.1.0"
description = "Debrief sailplane competition flights: analyse a flight against its task, compare pilots and days."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # opensoar 2.1.3 pins aerofiles<1.5; 1.5.x is on PyPI but cannot be used with it.
    "aerofiles>=1.4.3,<1.5",
    "opensoar>=2.1.3",
    "polars>=1.30",
    "plotly>=6.0",
    "pydeck>=0.9.3",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
debrief = "debrief.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debrief"]

[tool.hatch.build.targets.wheel.force-include]
"src/debrief/app/replay_page.html" = "debrief/app/replay_page.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/I/UP/B were here from the start. The rest were added in a cleanup pass
# and each one caught something real:
#   SIM   comprehensions and conditionals written the long way
#   C4    list() around a comprehension that could be a set or dict
#   RET   a variable assigned only to be returned on the next line
#   PIE   duplicate dict keys and dead "pass" branches
#   PTH   os.path where pathlib is already the house style
#   RUF   ruff's own checks, including mutable dataclass defaults
#   ARG   parameters nothing in the body reads
#   DTZ   naive datetimes, in a project where every fix is timezone-aware
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PIE", "PTH", "RUF", "ARG", "DTZ"]
ignore = [
    # Δ, ×, → and the em dash appear throughout the prose in docstrings and in
    # chart labels, where they are the right characters rather than lookalikes.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests name their fixtures as parameters and do not always read them; a test
# that asserts on a side effect is a normal shape, not an unused argument.
"tests/*" = ["ARG001"]
# Plotly layouts are deeply nested keyword structures, and dict(x=1) reads
# better than {"x": 1} when it is nested five levels deep — which is why
# plotly's own documentation is written that way.
"src/debrief/app/charts.py" = ["C408"]
