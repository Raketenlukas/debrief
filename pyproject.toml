[project]
name = "debrief"
version = "0.1.0"
description = "Debrief sailplane competition flights: analyse a flight against its task, compare pilots and days."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # opensoar 2.1.3 pins aerofiles<1.5; 1.5.x is on PyPI but cannot be used with it.
    "aerofiles>=1.4.3,<1.5",
    "opensoar>=2.1.3",
    "polars>=1.30",
    "plotly>=6.0",
    "pydeck>=0.9.3",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
debrief = "debrief.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debrief"]

[tool.hatch.build.targets.wheel.force-include]
"src/debrief/app/replay_page.html" = "debrief/app/replay_page.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
